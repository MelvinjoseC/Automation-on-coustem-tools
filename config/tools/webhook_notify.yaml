name: webhook_notify
description: Dispatch notification payload to Slack, Discord, or generic incident webhook
type: api
inputs:
  - name: url
    type: string
    description: Webhook endpoint URL
    required: true
  - name: method
    type: string
    description: HTTP Method
    default: "POST"
  - name: headers
    type: object
    description: Custom HTTP request headers
    default:
      Content-Type: "application/json"
  - name: body
    type: object
    description: Webhook JSON message payload
    required: true
  - name: timeout
    type: number
    description: Timeout in milliseconds
    default: 8000
outputs:
  - name: status
    type: number
  - name: statusText
    type: string
  - name: latencyMs
    type: number
  - name: body
    type: string
